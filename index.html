<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Catalogue Figurines</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; padding: 20px; margin: 0; }
        
        /* Barre de recherche */
        .search-container {
            width: 100%; max-width: 500px; margin: 0 auto 30px auto;
            position: sticky; top: 10px; z-index: 100;
        }
        #searchInput {
            width: 100%; padding: 12px 20px; border-radius: 25px;
            border: 2px solid #2ecc71; font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); outline: none;
        }

        /* Container principal */
        .shop-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            justify-content: center; 
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* Carte produit réglée pour 4 par ligne */
        .product-card { 
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: calc(25% - 20px); 
            min-width: 250px; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .product-card:hover { transform: translateY(-5px); }

        @media (max-width: 1100px) { .product-card { width: calc(50% - 20px); } }
        @media (max-width: 600px) { .product-card { width: 100%; } }

        .gallery-container { position: relative; width: 100%; height: 220px; background: #eee; }
        .image-gallery { 
            display: flex; overflow-x: auto; scroll-snap-type: x mandatory; 
            height: 100%; scrollbar-width: none; scroll-behavior: smooth;
        }
        .image-gallery::-webkit-scrollbar { display: none; }
        .image-gallery img { width: 100%; flex-shrink: 0; object-fit: cover; scroll-snap-align: start; cursor: zoom-in; }

        .nav-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9); border: none; border-radius: 50%;
            width: 30px; height: 30px; cursor: pointer; font-weight: bold;
            display: flex; align-items: center; justify-content: center; z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .prev { left: 8px; }
        .next { right: 8px; }

        .content { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
        .price { font-size: 1.2rem; font-weight: bold; color: #2ecc71; }
        h2 { font-size: 1rem; margin: 10px 0; color: #333; height: 2.4em; overflow: hidden; }
        p { font-size: 0.85rem; color: #666; line-height: 1.4; margin-bottom: 15px; flex-grow: 1; }

        /* --- NOUVEAU : Bouton Contacter --- */
        .contact-btn {
            background-color: #2ecc71; color: white; border: none;
            padding: 10px; border-radius: 8px; cursor: pointer;
            font-weight: bold; transition: background 0.3s; width: 100%;
            margin-top: auto;
        }
        .contact-btn:hover { background-color: #27ae60; }

        /* Style commun pour les fenêtres surgissantes */
        .modal {
            display: none; position: fixed; z-index: 1000;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center; align-items: center;
        }

        /* Modale Contact spécifique */
        .modal-content {
            background: white; padding: 30px; border-radius: 15px;
            max-width: 400px; width: 90%; text-align: center; position: relative;
        }
        .modal-content h3 { margin-top: 0; color: #333; }
        .close-x { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #333; }

        #modalImg { max-width: 90%; max-height: 90%; border-radius: 10px; }
        #closeModal { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Rechercher une figurine..." onkeyup="filterProducts()">
    </div>

    <div id="shop" class="shop-container"></div>

    <div id="modal" class="modal" onclick="closeImage()">
        <span id="closeModal">&times;</span>
        <img id="modalImg">
    </div>

    <div id="contactModal" class="modal" onclick="closeContact()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-x" onclick="closeContact()">&times;</span>
            <h3>Me contacter</h3>
            <p><strong>Adresse mail :</strong><br>chaftmine3.0@gmail.com</p>
            <p><strong>Mon Vinted :</strong><br>KenzoWtr</p>
        </div>
    </div>

    <script>
        const produits = [
            { id: 1, nom: "Bitty Pop Hello Kitty", prix: "11€", description: "Pack 2 figurines version licorne. Neuf.", images: ["IMG/BITTYHELLO1.jpg", "IMG/BITTYHELLO2.jpg"] },
            { id: 2, nom: "Figurine Nendoroid Sayori", prix: "45€", description: "Figurine du jeu DOKI DOKI LITTERATURE CLUB, en état pratiquement parfait juste le carton de la boite un peu abimé.", images: ["IMG/NENDOSAYORI.jpg", "IMG/NENDOSAYORI2.jpg"] },
            { id: 3, nom: "Figurine Nendoroid Mao Mao", prix: "45€", description: "Figurine Nendoroid Mao Mao en parfait état (Les Carnets de l'Aphoticaire).", images: ["IMG/NENDOCARNET2.jpg", "IMG/NENDOCARNET3.jpg"] },
            { id: 4, nom: "Figurine Duo Carnet Apothicaire", prix: "14€", description: "Mini figurines en parfait état.", images: ["IMG/MINIFIGCARNET1.jpg", "IMG/MINIFIGCARNET2.jpg"] },
            { id: 5, nom: "Porte-clé Pop Power", prix: "6,5€", description: "Porte-clé Power Pop neuf (Chainsaw Man).", images: ["IMG/MINIPOPPOWER1.jpg", "IMG/MINIPOPPOWER2.jpg"] },
            { id: 6, nom: "Album Twice Enemy Rouge", prix: "20€", description: "Album Twice Enemy version rouge avec photocard.", images: ["IMG/ENEMYROUGE1.jpg", "IMG/ENEMYROUGE2.jpg"] },
            { id: 7, nom: "Album Twice Enemy Jaune", prix: "20€", description: "Album Twice Enemy version jaune avec photocard.", images: ["IMG/ENEMYJAUNE1.jpg", "IMG/ENEMYJAUNE2.jpg"] },
            { id: 8, nom: "Album Twice This is for", prix: "16€", description: "Album Twice This is for ver. Nayeon avec photocard.", images: ["IMG/THISISFOR1.jpg", "IMG/THISISFOR2.jpg"] },
            { id: 9, nom: "Peluche Freddy", prix: "15€", description: "Peluche Freddy neuve de la série Fnaf en parfait état.", images: ["IMG/FREDDY1.jpg", "IMG/FREDDY2.jpg"] },
            { id: 10, nom: "Peluche Bunny", prix: "10€", description: "Peluche Bunny neuve de la série Fnaf en parfait état , avec un petit truc en plus.", images: ["IMG/BUNNY1.jpg", "IMG/BUNNY2.jpg"] }
        ];

        const shop = document.getElementById('shop');

        function displayProducts() {
            shop.innerHTML = "";
            produits.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.setAttribute('data-name', p.nom.toLowerCase());
                
                const galleryId = `gallery-${p.id}`;
                let imagesHtml = p.images.map(img => `<img src="${img}" alt="${p.nom}" onclick="openImage(this.src)" onerror="this.src='https://via.placeholder.com/300x200?text=Image+Introuvable'">`).join('');
                
                card.innerHTML = `
                    <div class="gallery-container">
                        ${p.images.length > 1 ? `
                            <button class="nav-btn prev" onclick="event.stopPropagation(); document.getElementById('${galleryId}').scrollBy({left: -250, behavior: 'smooth'})">❮</button>
                            <button class="nav-btn next" onclick="event.stopPropagation(); document.getElementById('${galleryId}').scrollBy({left: 250, behavior: 'smooth'})">❯</button>
                        ` : ''}
                        <div class="image-gallery" id="${galleryId}">${imagesHtml}</div>
                    </div>
                    <div class="content">
                        <div class="price">${p.prix}</div>
                        <h2>${p.nom}</h2>
                        <p>${p.description}</p>
                        <button class="contact-btn" onclick="openContact()">Contacter</button>
                    </div>
                `;
                shop.appendChild(card);
            });
        }

        // Fonctions pour les modales
        function openImage(src) {
            document.getElementById('modal').style.display = "flex";
            document.getElementById('modalImg').src = src;
        }
        function closeImage() {
            document.getElementById('modal').style.display = "none";
        }

        function openContact() {
            document.getElementById('contactModal').style.display = "flex";
        }
        function closeContact() {
            document.getElementById('contactModal').style.display = "none";
        }

        function filterProducts() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.getElementsByClassName('product-card');
            Array.from(cards).forEach(card => {
                const name = card.getAttribute('data-name');
                card.style.display = name.includes(input) ? "flex" : "none";
            });
        }

        displayProducts();
    </script>
</body>
</html>
